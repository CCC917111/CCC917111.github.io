<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Conceptual interaction between agents, markets and rules</title><desc id="desc">Agents choose and learn, markets allocate and respond, and rules guide and govern. A conceptual feedback loop connects the three. No quantities or experimental outcomes are represented.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#245eea"/></marker><marker id="mint" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0c806e"/></marker><marker id="amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a26016"/></marker><marker id="light" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a4c5ff"/></marker></defs><rect width="600" height="420" fill="#101c30"/><g font-family="Arial, Helvetica, sans-serif"><circle cx="300" cy="212" r="164" fill="none" stroke="#253650" stroke-width="1"/><circle cx="300" cy="212" r="112" fill="none" stroke="#253650" stroke-width="1"/><path d="M 267 127 C 181 132 132 173 147 230" fill="none" stroke="#a4c5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#light)" /><path d="M 220 301 C 289 348 335 347 366 304" fill="none" stroke="#a4c5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#light)" /><path d="M 470 241 C 490 172 426 127 386 123" fill="none" stroke="#a4c5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#light)" /><text x="129" y="179" font-size="15" fill="#b6c9e5" font-weight="400" text-anchor="middle" >act</text><text x="311" y="344" font-size="15" fill="#b6c9e5" font-weight="400" text-anchor="middle" >feedback</text><text x="477" y="178" font-size="15" fill="#b6c9e5" font-weight="400" text-anchor="middle" >govern</text><rect x="220" y="58" width="160" height="91" rx="15" fill="#152c51" stroke="#4a7cce" /><text x="300.0" y="94" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle" >Agents</text><text x="300.0" y="121" font-size="15" fill="#a4c5ff" font-weight="400" text-anchor="middle" >Choose + learn</text><rect x="61" y="237" width="180" height="91" rx="15" fill="#163b37" stroke="#398e7e" /><text x="151.0" y="273" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle" >Markets</text><text x="151.0" y="300" font-size="15" fill="#8ce0c9" font-weight="400" text-anchor="middle" >Allocate + respond</text><rect x="373" y="237" width="166" height="91" rx="15" fill="#3c3025" stroke="#91724a" /><text x="456.0" y="273" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle" >Rules</text><text x="456.0" y="300" font-size="15" fill="#f1c18a" font-weight="400" text-anchor="middle" >Guide + govern</text><circle cx="300" cy="212" r="8" fill="#7ba8ff"/><circle cx="300" cy="212" r="20" fill="none" stroke="#426198"/><text x="300" y="393" font-size="16" fill="#c3d2e8" font-weight="400" text-anchor="middle" >Interaction · feedback · adaptation</text></g></svg>
