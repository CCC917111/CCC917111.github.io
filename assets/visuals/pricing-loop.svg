<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Conceptual workflow of LLM pricing agents</title><desc id="desc">Two LLM sellers choose prices and retain separate private persistent notes. Prices enter a market, which returns current feedback. A regulator observes the offers and can flag, request revision or veto them. This is a conceptual workflow, not experimental data.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#245eea"/></marker><marker id="mint" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0c806e"/></marker><marker id="amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a26016"/></marker><marker id="light" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a4c5ff"/></marker></defs><rect width="720" height="400" fill="#f4f6fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="32" font-size="12" fill="#245eea" font-weight="700" letter-spacing="1.5">CONCEPTUAL METHOD</text><text x="28" y="64" font-size="24" fill="#172339" font-weight="700" >Pricing agents in a feedback loop</text><rect x="28" y="116" width="220" height="190" rx="12" fill="white" stroke="#d7e0eb" /><text x="48" y="145" font-size="18" fill="#172339" font-weight="700" >Two LLM sellers</text><rect x="46" y="164" width="87" height="44" rx="8" fill="#e9efff" stroke="#c7d7ff" /><rect x="143" y="164" width="87" height="44" rx="8" fill="#e1f4ef" stroke="#b9ded5" /><text x="89" y="191" font-size="16" fill="#245eea" font-weight="700" text-anchor="middle" >Seller A</text><text x="186" y="191" font-size="16" fill="#096c5c" font-weight="700" text-anchor="middle" >Seller B</text><text x="48" y="242" font-size="16" fill="#172339" font-weight="400" >Each keeps private,</text><text x="48" y="265" font-size="16" fill="#172339" font-weight="400" >persistent notes.</text><text x="48" y="287" font-size="13" fill="#526178" font-weight="400" >Reason → choose a price</text><rect x="314" y="153" width="120" height="114" rx="12" fill="#e9efff" stroke="#c7d7ff" /><text x="374" y="193" font-size="19" fill="#245eea" font-weight="700" text-anchor="middle" >Market</text><text x="374" y="219" font-size="15" fill="#526178" font-weight="400" text-anchor="middle" >Demand</text><text x="374" y="242" font-size="15" fill="#526178" font-weight="400" text-anchor="middle" >+ outcomes</text><rect x="500" y="116" width="192" height="190" rx="12" fill="#fff5e7" stroke="#ead2b2" /><text x="520" y="146" font-size="18" fill="#a26016" font-weight="700" >Regulator</text><text x="520" y="182" font-size="16" fill="#172339" font-weight="400" >Observe offers</text><text x="520" y="209" font-size="16" fill="#172339" font-weight="400" >Flag</text><text x="520" y="236" font-size="16" fill="#172339" font-weight="400" >Request revision</text><text x="520" y="263" font-size="16" fill="#172339" font-weight="400" >Veto</text><path d="M 249 184 L 307 184" fill="none" stroke="#245eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="278" y="172" font-size="12" fill="#245eea" font-weight="700" text-anchor="middle" >Prices</text><path d="M 436 183 L 492 183" fill="none" stroke="#a26016" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)" /><text x="464" y="171" font-size="12" fill="#a26016" font-weight="700" text-anchor="middle" >Review</text><path d="M 499 246 L 442 246" fill="none" stroke="#a26016" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)" /><text x="470" y="271" font-size="12" fill="#a26016" font-weight="700" text-anchor="middle" >Action</text><path d="M 374 270 L 374 335 L 139 335 L 139 313" fill="none" stroke="#0c806e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)" /><text x="255" y="363" font-size="16" fill="#096c5c" font-weight="700" text-anchor="middle" >Current market feedback</text></g></svg>
