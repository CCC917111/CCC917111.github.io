<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Conceptual method for long-tail driving scene discovery</title><desc id="desc">Driving frames pass through a frozen vision-language model. Hidden states enter a tail-guided sparse autoencoder that separates normal and long-tail subspaces. Readable latent units provide retrieval keys. The latent units shown are schematic and do not represent measured activations.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#245eea"/></marker><marker id="mint" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0c806e"/></marker><marker id="amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a26016"/></marker><marker id="light" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a4c5ff"/></marker></defs><rect width="720" height="400" fill="#f4f6fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="32" font-size="12" fill="#245eea" font-weight="700" letter-spacing="1.5">CONCEPTUAL METHOD</text><text x="28" y="64" font-size="24" fill="#172339" font-weight="700" >From hidden states to readable retrieval</text><rect x="28" y="136" width="165" height="123" rx="12" fill="white" stroke="#d7e0eb" /><text x="49" y="166" font-size="18" fill="#172339" font-weight="700" >Frozen VLM</text><text x="49" y="192" font-size="15" fill="#526178" font-weight="400" >Driving frames</text><text x="49" y="214" font-size="17" fill="#245eea" font-weight="700" >↓</text><text x="49" y="238" font-size="15" fill="#172339" font-weight="400" >Hidden states</text><rect x="149" y="221" width="4" height="16" rx="1" fill="#9eb8fa" stroke="#9eb8fa" /><rect x="156" y="210" width="4" height="27" rx="1" fill="#9eb8fa" stroke="#9eb8fa" /><rect x="163" y="215" width="4" height="22" rx="1" fill="#9eb8fa" stroke="#9eb8fa" /><rect x="170" y="203" width="4" height="34" rx="1" fill="#9eb8fa" stroke="#9eb8fa" /><path d="M 196 195 L 251 195" fill="none" stroke="#245eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="259" y="113" width="188" height="171" rx="12" fill="white" stroke="#d7e0eb" /><text x="280" y="145" font-size="17" fill="#172339" font-weight="700" >Sparse autoencoder</text><text x="280" y="170" font-size="14" fill="#526178" font-weight="400" >Tail-guided objective</text><rect x="281" y="190" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="302" y="190" width="14" height="14" rx="3" fill="#245eea" stroke="#245eea" /><rect x="323" y="190" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="344" y="190" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="365" y="190" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="386" y="190" width="14" height="14" rx="3" fill="#245eea" stroke="#245eea" /><rect x="407" y="190" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="281" y="214" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="302" y="214" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="323" y="214" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="344" y="214" width="14" height="14" rx="3" fill="#245eea" stroke="#245eea" /><rect x="365" y="214" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="386" y="214" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><rect x="407" y="214" width="14" height="14" rx="3" fill="#e9eef5" stroke="#dbe3ed" /><text x="280" y="259" font-size="14" fill="#526178" font-weight="400" >Sparse, readable units</text><rect x="513" y="104" width="179" height="72" rx="12" fill="white" stroke="#d7e0eb" /><text x="535" y="133" font-size="17" fill="#172339" font-weight="700" >Normal subspace</text><text x="535" y="156" font-size="14" fill="#526178" font-weight="400" >Common patterns</text><rect x="513" y="223" width="179" height="72" rx="12" fill="#e1f4ef" stroke="#b9ded5" /><text x="535" y="253" font-size="16" fill="#096c5c" font-weight="700" >Long-tail subspace</text><text x="535" y="276" font-size="14" fill="#096c5c" font-weight="400" >Searchable conditions</text><path d="M 449 162 L 480 162 L 480 140 L 505 140" fill="none" stroke="#245eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 449 234 L 480 234 L 480 260 L 505 260" fill="none" stroke="#0c806e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)" /><rect x="166" y="328" width="526" height="45" rx="9" fill="white" stroke="#d7e0eb" /><path d="M 604 298 L 604 321" fill="none" stroke="#0c806e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)" /><text x="429" y="356" font-size="17" fill="#172339" font-weight="700" text-anchor="middle" >Unit activations become retrieval keys</text></g></svg>
