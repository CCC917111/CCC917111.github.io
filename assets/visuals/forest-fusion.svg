<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Conceptual workflow of multimodal forest segmentation</title><desc id="desc">Sentinel-2 time sequences enter a Mamba-2 temporal encoder. Temporal features are combined with climate, elevation and neighbour context through spatial and modality fusion to produce pixel-level forest classes. The three-by-three grid is a schematic, not an observed or predicted geographic map.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#245eea"/></marker><marker id="mint" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0c806e"/></marker><marker id="amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a26016"/></marker><marker id="light" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a4c5ff"/></marker></defs><rect width="720" height="400" fill="#f4f6fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="32" font-size="12" fill="#245eea" font-weight="700" letter-spacing="1.5">CONCEPTUAL WORKFLOW</text><text x="28" y="64" font-size="24" fill="#172339" font-weight="700" >Time, space and context for forest mapping</text><rect x="28" y="107" width="182" height="86" rx="12" fill="white" stroke="#d7e0eb" /><text x="46" y="134" font-size="16" fill="#172339" font-weight="700" >Sentinel-2 sequence</text><rect x="48" y="148" width="18" height="26" rx="3" fill="#dcece9" stroke="#ffffff" /><rect x="76" y="148" width="18" height="26" rx="3" fill="#b6d6cc" stroke="#ffffff" /><rect x="104" y="148" width="18" height="26" rx="3" fill="#8fbaaa" stroke="#ffffff" /><rect x="132" y="148" width="18" height="26" rx="3" fill="#669e89" stroke="#ffffff" /><rect x="160" y="148" width="18" height="26" rx="3" fill="#387b65" stroke="#ffffff" /><text x="46" y="185" font-size="10" fill="#526178" font-weight="400" >t₁</text><text x="160" y="185" font-size="10" fill="#526178" font-weight="400" >tₙ</text><rect x="28" y="216" width="182" height="46" rx="12" fill="white" stroke="#d7e0eb" /><text x="48" y="245" font-size="16" fill="#172339" font-weight="700" >Climate variables</text><rect x="28" y="285" width="182" height="46" rx="12" fill="white" stroke="#d7e0eb" /><text x="48" y="314" font-size="16" fill="#172339" font-weight="700" >Elevation</text><rect x="278" y="113" width="194" height="81" rx="12" fill="#e9efff" stroke="#c7d7ff" /><text x="298" y="144" font-size="19" fill="#245eea" font-weight="700" >Mamba-2</text><text x="298" y="171" font-size="15" fill="#526178" font-weight="400" >Temporal encoding</text><rect x="278" y="231" width="194" height="100" rx="12" fill="#e1f4ef" stroke="#b9ded5" /><text x="298" y="263" font-size="16" fill="#096c5c" font-weight="700" >Spatial + modality</text><text x="298" y="288" font-size="18" fill="#096c5c" font-weight="700" >fusion</text><text x="298" y="312" font-size="14" fill="#526178" font-weight="400" >Neighbour context</text><path d="M 212 149 L 270 149" fill="none" stroke="#245eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 375 198 L 375 223" fill="none" stroke="#245eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 212 239 L 270 259" fill="none" stroke="#0c806e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)" /><path d="M 212 308 L 270 298" fill="none" stroke="#0c806e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)" /><text x="595" y="132" font-size="16" fill="#172339" font-weight="700" text-anchor="middle" >Pixel-level classes</text><rect x="535" y="153" width="39" height="39" rx="3" fill="#b9d9cb" stroke="#ffffff" /><rect x="576" y="153" width="39" height="39" rx="3" fill="#b9d9cb" stroke="#ffffff" /><rect x="617" y="153" width="39" height="39" rx="3" fill="#5c9b80" stroke="#ffffff" /><rect x="535" y="194" width="39" height="39" rx="3" fill="#b9d9cb" stroke="#ffffff" /><rect x="576" y="194" width="39" height="39" rx="3" fill="#5c9b80" stroke="#ffffff" /><rect x="617" y="194" width="39" height="39" rx="3" fill="#5c9b80" stroke="#ffffff" /><rect x="535" y="235" width="39" height="39" rx="3" fill="#244e43" stroke="#ffffff" /><rect x="576" y="235" width="39" height="39" rx="3" fill="#244e43" stroke="#ffffff" /><rect x="617" y="235" width="39" height="39" rx="3" fill="#5c9b80" stroke="#ffffff" /><path d="M 474 278 L 510 278 L 510 215 L 527 215" fill="none" stroke="#0c806e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)" /><text x="595" y="300" font-size="14" fill="#526178" font-weight="400" text-anchor="middle" >Schematic type map</text><text x="28" y="377" font-size="14" fill="#526178" font-weight="400" >Workflow illustration · the grid is not a geographic result.</text></g></svg>
